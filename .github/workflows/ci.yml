name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  actionlint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error

  # One leg per platform, defined once in native.yml and shared with release.yml.
  native:
    uses: ./.github/workflows/native.yml

  test:
    name: test ${{ matrix.leg }} jdk${{ matrix.jvm }}
    needs: native
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { leg: linux-x86_64,   runner: ubuntu-22.04,     jvm: 11 }
          - { leg: linux-x86_64,   runner: ubuntu-22.04,     jvm: 17 }
          - { leg: linux-x86_64,   runner: ubuntu-22.04,     jvm: 21 }
          - { leg: linux-aarch64,  runner: ubuntu-22.04-arm, jvm: 11 }
          - { leg: osx-x86_64,     runner: macos-15-intel,   jvm: 11 }
          - { leg: osx-aarch64,    runner: macos-14,         jvm: 11 }
          - { leg: windows-x86_64, runner: windows-2022,     jvm: 11 }
          - { leg: windows-x86_64, runner: windows-2022,     jvm: 17 }
          - { leg: windows-x86_64, runner: windows-2022,     jvm: 21 }
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # test data under src/test/resources

      - uses: actions/download-artifact@v8
        with:
          name: natives-${{ matrix.leg }}
          path: native/dist/resources

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.jvm }}
          cache: maven

      - name: Install libomp
        if: runner.os == 'macOS'
        run: brew install libomp

      - run: mvn -B test

  # Fan-in: merge every leg's natives into one jar and check the committed SWIG java is current.
  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: native/dist/resources
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: swig-java
          path: native/dist/java

      - name: Verify all natives present
        run: bash native/verify-dist.sh

      - name: Committed SWIG java is up to date
        run: |
          find src/main/java/com/microsoft/ml/lightgbm -maxdepth 1 -name '*.java' ! -name PredictionType.java ! -name SwigPointers.java -delete
          cp native/dist/java/com/microsoft/ml/lightgbm/*.java src/main/java/com/microsoft/ml/lightgbm/
          git diff --exit-code --stat -- src/main/java/com/microsoft/ml/lightgbm \
            || { echo "::error::src/main/java/com/microsoft/ml/lightgbm is stale; run native/linux.sh and commit the result"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - run: mvn -B -DskipTests package

      - name: Jar bundles all five platforms
        run: |
          jar=""
          for f in target/lightgbm4j-*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) ;; *) jar="$f" ;; esac
          done
          [[ -n "$jar" ]] || { echo "::error::main jar not found in target/"; exit 1; }
          unzip -l "$jar" | grep 'lightgbm4j/' | grep -E 'lib_lightgbm' | tee /tmp/natives.txt
          for dir in linux/x86_64 linux/aarch64 osx/x86_64 osx/aarch64 windows/x86_64; do
            [[ "$(grep -c "lightgbm4j/$dir/" /tmp/natives.txt)" == 4 ]] || { echo "::error::$dir does not have 2 libs + 2 md5 in $jar"; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/lightgbm4j-*.jar
          retention-days: 7
