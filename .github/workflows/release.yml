name: release

# Tag X.Y.Z-N on main -> build natives on all platforms (native.yml), publish to Maven Central,
# create the GitHub release. Same shape and secret names as metarank/ltrlib's release.yml.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*' # 4.6.0-3 — no v prefix

permissions:
  contents: write # create release + upload assets

jobs:
  native:
    uses: ./.github/workflows/native.yml

  publish:
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # test data under src/test/resources; deploy runs the tests

      - uses: actions/download-artifact@v8
        with:
          pattern: natives-*
          path: native/dist/resources
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          name: swig-java
          path: native/dist/java

      - name: Verify all natives present
        run: bash native/verify-dist.sh

      - name: Committed SWIG java is up to date
        run: |
          find src/main/java/com/microsoft/ml/lightgbm -maxdepth 1 -name '*.java' ! -name PredictionType.java ! -name SwigPointers.java -delete
          cp native/dist/java/com/microsoft/ml/lightgbm/*.java src/main/java/com/microsoft/ml/lightgbm/
          git diff --exit-code --stat -- src/main/java/com/microsoft/ml/lightgbm \
            || { echo "::error::src/main/java/com/microsoft/ml/lightgbm is stale; run native/linux.sh and commit the result"; exit 1; }

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          server-id: central # matches <publishingServerId> in pom.xml
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Verify pom version matches the tag
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          [[ "$version" == "$GITHUB_REF_NAME" ]] \
            || { echo "::error::pom.xml version is $version but the tag is $GITHUB_REF_NAME"; exit 1; }

      - name: Import PGP key
        run: echo "$PGP_SECRET" | gpg --batch --import
        env:
          PGP_SECRET: ${{ secrets.PGP_SECRET }}

      - name: Build and check the jar bundles all five platforms
        run: |
          mvn -B -DskipTests package
          jar=""
          for f in target/lightgbm4j-*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) ;; *) jar="$f" ;; esac
          done
          [[ -n "$jar" ]] || { echo "::error::main jar not found in target/"; exit 1; }
          unzip -l "$jar" | grep 'lightgbm4j/' | grep -E 'lib_lightgbm' | tee /tmp/natives.txt
          for dir in linux/x86_64 linux/aarch64 osx/x86_64 osx/aarch64 windows/x86_64; do
            [[ "$(grep -c "lightgbm4j/$dir/" /tmp/natives.txt)" == 4 ]] || { echo "::error::$dir does not have 2 libs + 2 md5 in $jar"; exit 1; }
          done

      - name: Test, sign and publish to Maven Central
        run: mvn -B deploy
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: target/lightgbm4j-*.jar*
